<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora Player</title>
    <link
      rel="icon"
      type="image/png"
      href="../images/Nexora-Logo (2).png"
      width="420"
      height="420"
    />
    <link rel="stylesheet" href="../CSS/platforms.css" />
    <style>
      body {
        margin: 0;
        padding: 1.5rem;
      }

      .player-shell {
        max-width: 1000px;
        margin: 0 auto;
      }

      .player-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      .player-title {
        font-size: clamp(1.8rem, 3vw, 2.4rem);
        font-weight: 700;
        margin: 0;
      }

      .player-meta {
        color: var(--muted);
        margin-top: 0.35rem;
      }

      .player-back {
        padding: 0.75rem 1rem;
        border-radius: 12px;
        background-color: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text);
        text-decoration: none;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }

      .player-back:hover {
        background-color: rgba(255, 255, 255, 0.12);
        transform: translateY(-1px);
      }

      html,
      body {
        min-height: 100%;
      }

      .player-video {
        width: 100%;
        aspect-ratio: 16 / 9;
        min-height: 280px;
        border-radius: 24px;
        overflow: hidden;
        background-color: #000;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
        position: relative;
      }

      .player-video iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .player-video:fullscreen,
      .player-video:-webkit-full-screen,
      .player-video:-moz-full-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        padding-top: 0;
        border-radius: 0;
        z-index: 9999;
      }

      .player-video iframe:fullscreen,
      .player-video iframe:-webkit-full-screen,
      .player-video iframe:-moz-full-screen {
        width: 100vw;
        height: 100vh;
      }

      @media (max-width: 620px) {
        body {
          padding: 0.75rem 0.5rem 1rem;
        }

        .player-shell {
          max-width: 100%;
          padding: 0;
        }

        .player-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.75rem;
          margin-bottom: 1rem;
        }

        .player-title {
          font-size: 1.7rem;
        }

        .player-video {
          padding-top: 80%;
          border-radius: 16px;
          box-shadow: 0 22px 60px rgba(0, 0, 0, 0.3);
        }

        .player-description {
          padding: 1rem;
        }
      }

      .player-description {
        margin-top: 1rem;
        padding: 1rem 1.1rem;
        border-radius: 18px;
        background-color: rgba(255, 255, 255, 0.04);
      }

      .player-description p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .player-footer {
        margin-top: 1rem;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }
    </style>
    <style>
      .logo{
        display: flex;
        width: 80px;
        height: 80px;
        flex-direction: row;
      }
      .logo-2{
        width: 80px;
        height: 150px;
        font-weight: 800;
        font-size: xx-large;
        
      }
    </style>
  </head>
  <body>
    <div class="player-shell">
      <div class="logo">
      <img src="../images/Nexora-Logo (2).png" alt="Nexora Logo" class="logo-1" />
      <h1 class="logo-2">exora</h1>
    </div>
      <div class="player-header">
        <div>
          <h1 class="player-title" id="playerTitle">Loading...</h1>
          <p class="player-meta" id="playerMeta"></p>
        </div>
        <a href="../HTML/platforms.html" class="player-back">Back to library</a>
      </div>

      <div class="player-video">
        <iframe
          id="moviePlayer"
          src=""
          title="Movie trailer player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>

      <div class="player-description">
        <p id="playerDescription">
          Select a movie from the library to watch it here.
        </p>
      </div>

      <div class="player-footer">
        <div id="playerMore"></div>
      </div>
    </div>

    <script src="../Javascript/player.js"></script>
  </body>
</html>
