<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora</title>
    <link
      rel="icon"
      type="image/png"
      href="../images/Nexora-Logo.png"
      width="420"
      height="420"
    />
    <link rel="stylesheet" href="../CSS/platforms.css" />
  </head>
  <body>
    <h1 id="title">Prime Video</h1>
    <div>
      <h1 id="subtitle">
        Explore Thousands of Movies and Tv shows on <br />
       Prime Video
      </h1>
    </div>
    <div id="toggle">
      <button id="all">All</button>
    </div>

    <div class="content-row">
      <div class="content-card">
        <a
          href="player.html?movie=spiderman-brand-new-day"
          class="movie-link"
        >
          <figure class="movie-figure">
            <img
              class="movie-image"
              src="../images/SBND.jpg"
              alt="Spiderman Brand New Day poster"
            />
            <figcaption class="movie-caption">
              <span class="movie-title" id="spider"
                >Spiderman
                <span id="brand"
                  >Brand New <span id="day">Day</span></span
                ></span
              >
              <small class="movie-year">2026</small>
            </figcaption>
          </figure>
        </a>
      </div>
      <div class="content-card">
        <a
          href="player.html?movie=dune-part-1"
          class="movie-link"
        >
          <figure class="movie-figure">
            <img class="movie-image" src="../images/Dune.jpg" alt="Dune poster" />
            <figcaption class="movie-caption">
              <span class="movie-title">Dune Part 1</span>
              <small class="movie-year">2021</small>
            </figcaption>
          </figure>
        </a>
      </div>
      <div class="content-card">
        <a
          href="player.html?movie=72-hours"
          class="movie-link"
        >
          <figure class="movie-figure">
            <img
              class="movie-image"
              src="../images/72 Hours.jpg"
              alt="72 Hours poster"
            />
            <figcaption class="movie-caption">
              <span class="movie-title">72 Hours</span>
              <small class="movie-year">2026</small>
            </figcaption>
          </figure>
        </a>
      </div>
      <div class="content-card">
        <a
          href="player.html?movie=moana"
          class="movie-link"
        >
          <figure class="movie-figure">
            <img
              class="movie-image"
              src="../images/moana.jpg"
              alt="Moana poster"
            />
            <figcaption class="movie-caption">
              <span class="movie-title">Moana</span>
              <small class="movie-year">2026</small>
            </figcaption>
          </figure>
        </a>
      </div>
      <div class="content-card">
        <a
          href="player.html?movie=back-in-action"
          class="movie-link"
        >
          <figure class="movie-figure">
            <img
              class="movie-image"
              src="../images/Back in action.jpg"
              alt="Back in Action poster"
            />
            <figcaption class="movie-caption">
              <span class="movie-title">Moana</span>
              <small class="movie-year">2025</small>
            </figcaption>
          </figure>
        </a>
      </div>
      <div class="content-card">
        <a
          href="player.html?movie=havoc"
          class="movie-link"
        >
          <figure class="movie-figure">
            <img
              class="movie-image"
              src="/images/Havoc.jpg"
              alt="Spiderman Brand New Day poster"
            />
            <figcaption class="movie-caption">
              <span class="movie-title">Havoc</span>
              <small class="movie-year">2025</small>
            </figcaption>
          </figure>
        </a>
      </div>
    </div>
  </body>
</html>
