<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora</title>
    <link
      rel="icon"
      type="image/png"
      href="images/Nexora-Logo.png"
      width="420"
      height="420"
    />
    <link rel="stylesheet" href="landing-page.css" />
  </head>
  <body>
    <h1 id="title">Neflix</h1>
    <div>
      <h1 id="subtitle">
        Explore Thousands of Movies and Tv shows on <br />
        Netflix
      </h1>
    </div>
    <div id="toggle">
      <button id="all">All</button>
      <button id="movies">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#e3e3e3"
        >
          <path
            d="M320-200v-560l440 280-440 280Zm80-280Zm0 134 210-134-210-134v268Z"
          />
        </svg>
        Movies
      </button>
      <button id="tv">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#e3e3e3"
        >
          <path
            d="M320-120v-80H160q-33 0-56.5-23.5T80-280v-480q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v480q0 33-23.5 56.5T800-200H640v80H320ZM160-280h640v-480H160v480Zm0 0v-480 480Z"
          />
        </svg>
        Tv Shows
      </button>
      <div class="filter-select">
        <select aria-label="Filter by genre">
          <option>Action</option>
          <option>Romance</option>
          <option>Comedy</option>
          <option>Thriller</option>
          <option>Sci-fi</option>
        </select>
      </div>
    </div>

    <div class="content-row">
      <div class="content-card">
        <a href="https://youtu.be/daXaTug8rL4?si=AG-C_784EuAywdcn" class="movie-link">
          <figure class="movie-figure">
            <img
              class="movie-image"
              src="images/SBND.jpg"
              alt="Spiderman Brand New Day poster"
            />
            <figcaption class="movie-caption">
              <span class="movie-title">Spiderman Brand New Day</span>
              <small class="movie-year">2026</small>
            </figcaption>
          </figure>
        </a>
      </div>
      <div class="content-card">
        <a href="https://youtu.be/n9xhJrPXop4?si=ESLA1_RfsTjWdp5p" class="movie-link">
          <figure class="movie-figure">
            <img class="movie-image" src="images/Dune.jpg" alt="Dune poster" />
            <figcaption class="movie-caption">
              <span class="movie-title">Dune Part 1</span>
              <small class="movie-year">2021</small>
            </figcaption>
          </figure>
        </a>
      </div>
      <div class="content-card">
        <a href="https://youtu.be/N-J-HR3quc4?si=OqOs0HLgP2My-96X" class="movie-link">
          <figure class="movie-figure">
            <img
              class="movie-image"
              src="images/72 Hours.jpg"
              alt="Spiderman Brand New Day poster"
            />
            <figcaption class="movie-caption">
              <span class="movie-title">72 Hours</span>
              <small class="movie-year">2026</small>
            </figcaption>
          </figure>
        </a>
      </div>
    </div>

   
    <script src="landing-page.js"></script>
  </body>
</html>
