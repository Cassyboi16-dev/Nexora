<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora — Discover. Watch. Enjoy.</title>
 <link
      rel="icon"
      type="image/png"
      href="../images/Nexora-Logo (2).png"
      width="420"
      height="420"
    />
<style>
  :root{
    --bg: #0a0e1a;
    --panel: #0f1424;
    --sidebar: #0c1020;
    --accent-pink: #ec4899;
    --accent-purple: #7c3aed;
    --accent-blue: #3b82f6;
    --text: #f3f4f6;
    --text-dim: #9ca3af;
    --text-faint: #6b7280;
    --border: rgba(255,255,255,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    min-height:100vh;
  }
  a{text-decoration:none; color:inherit;}

  /* ---------- Top Bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 18px 32px;
    background: linear-gradient(180deg, rgba(10,14,26,1) 0%, rgba(10,14,26,0.85) 100%);
    position: sticky;
    top:0;
    z-index: 50;
    border-bottom: 1px solid var(--border);
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand .logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .brand .logo .bolt{
    color: var(--accent-pink);
    font-size: 20px;
  }
  .brand .tagline{
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .search-wrap{
    flex:1;
    display:flex;
    justify-content:center;
  }
  .search-box{
    width: 100%;
    max-width: 420px;
    display:flex;
    align-items:center;
    gap:10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 9px 18px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .search-box svg{ flex-shrink:0; opacity:0.6; }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .icon-btn{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background: rgba(255,255,255,0.04);
    cursor:pointer;
  }
  .avatar{
    width:34px; height:34px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
  }

  /* ---------- Layout ---------- */
  .layout{
    display:flex;
    align-items:flex-start;
  }
  
  /* ---------- Sidebar ---------- */
  .sidebar{
    width: 96px;
    padding: 24px 14px;
    display:flex;
    flex-direction:column;
    gap: 8px;
    flex-shrink:0;
  }
  .nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding: 12px 6px;
    border-radius: 12px;
    font-size: 10.5px;
    color: var(--text-faint);
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .nav-item svg{ opacity:0.7; }
  .nav-item:hover{ color: var(--text-dim); background: rgba(255,255,255,0.03); }
  .nav-item.active{
    background: linear-gradient(135deg, var(--accent-purple), #4f46e5);
    color: #fff;
  }
  .nav-item.active svg{ opacity:1; }

  /* ---------- Main content ---------- */
  .main{
    flex:1;
    padding: 24px 32px 60px;
    min-width:0;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    border-radius: 20px;
    overflow:hidden;
    min-height: 460px;
    display:flex;
    align-items:center;
    background:
      linear-gradient(90deg, rgba(10,14,26,0.97) 0%, rgba(10,14,26,0.55) 45%, rgba(10,14,26,0.15) 75%),
      radial-gradient(ellipse at 75% 30%, #2b4a6f 0%, #16233a 45%, #0a0e1a 80%);
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .hero-watermark{
    position:absolute;
    bottom: 18px;
    right: 40px;
    font-size: 46px;
    font-weight: 800;
    letter-spacing: 10px;
    color: rgba(255,255,255,0.07);
    pointer-events:none;
    text-transform:uppercase;
  }
  .hero-content{
    position:relative;
    z-index:2;
    padding: 40px 48px;
    max-width: 560px;
  }
  .badge{
    display:inline-block;
    background: var(--accent-pink);
    color:#fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 5px 14px;
    border-radius: 6px;
    margin-bottom: 18px;
  }
  .hero-title{
    font-size: 52px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1px;
    margin-bottom: 16px;
  }
  .hero-meta{
    display:flex;
    align-items:center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .hero-meta .genres{ color: var(--accent-pink); font-weight:600; }
  .pill{
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .hero-tagline{
    color: var(--text-dim);
    font-size: 15px;
    margin-bottom: 26px;
  }
  .hero-actions{
    display:flex;
    gap: 14px;
  }
  .btn{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 13px 26px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor:pointer;
    border: none;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .btn:hover{ transform: translateY(-1px); filter: brightness(1.08); }
  .btn-primary{
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
    color: #fff;
  }
  .btn-secondary{
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.14);
  }

  /* ---------- Rows ---------- */
  .row-section{
    margin-top: 42px;
  }
  .row-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 16px;
  }
  .row-header h2{
    font-size: 19px;
    font-weight: 700;
  }
  .view-all{
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-pink);
    cursor:pointer;
  }
  .row-scroll{
    display:flex;
    gap: 16px;
    overflow-x:auto;
    padding-bottom: 8px;
    scrollbar-width: thin;
  }
  .row-scroll::-webkit-scrollbar{ height:6px; }
  .row-scroll::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.1); border-radius:3px; }

  .promo-card{
    flex: 0 0 180px;
    height: 260px;
    border-radius: 14px;
    background: linear-gradient(160deg, var(--accent-purple), var(--accent-pink));
    padding: 20px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .promo-card h3{
    font-size: 18px;
    font-weight: 800;
    line-height: 1.25;
  }
  .promo-card p{
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    line-height: 1.4;
  }

  .card{
    flex: 0 0 180px;
    cursor:pointer;
  }
  .card-art{
    height: 260px;
    border-radius: 14px;
    overflow:hidden;
    position:relative;
    background-size: cover;
    background-position:center;
    display:flex;
    align-items:flex-end;
    transition: transform 0.2s ease;
  }
  .card:hover .card-art{ transform: translateY(-4px); }
  .card-art::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
  .card-badge{
    position:relative; z-index:2;
    margin: 12px;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: rgba(255,255,255,0.92);
    text-transform: uppercase;
  }
  .card-info{
    padding-top: 10px;
  }
  .card-info .t{
    font-size: 14px;
    font-weight: 700;
  }
  .card-info .y{
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 2px;
  }

   @media (max-width: 900px){
    .sidebar{ display:none; }
    .hero-title{ font-size: 36px; }
    .search-wrap{ display:none; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo"><span class="bolt">⚡</span>exora</div>
      <div class="tagline">Discover · Watch · Enjoy</div>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search movies, shows and more...
      </div>
    </div>
    <div class="topbar-right">
      <div class="icon-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="avatar"></div>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
        Home
      </div>
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Discover
      </div>
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>
        Trending
      </div>
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2"/></svg>
        Top Rated
      </div>
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Genres
      </div>
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Platforms
      </div>
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="9" y1="18" x2="15" y2="18"/></svg>
        Watchlist
      </div>
    </nav>

    <main class="main">
      <!-- HERO -->
      <section class="hero">
        <div class="hero-watermark">the odyssey</div>
        <div class="hero-content">
          <span class="badge">Featured Movie</span>
          <h1 class="hero-title">THE ODYSSEY</h1>
          <div class="hero-meta">
            <span class="genres">Action • Adventure • Sci-Fi</span>
            <span class="pill">2h 26m</span>
            <span class="pill">PG-13</span>
          </div>
          <p class="hero-tagline">A hero. A mission. A journey beyond limits.</p>
          <div class="hero-actions">
            <button class="btn btn-primary">▶ Watch Trailer</button>
            <button class="btn btn-secondary">More Info</button>
          </div>
        </div>
      </section>

      <!-- TRENDING -->
      <section class="row-section">
        <div class="row-header">
          <h2>Trending now</h2>
          <span class="view-all">View all</span>
        </div>
        <div class="row-scroll" id="trending-row"></div>
      </section>

      <!-- TOPRATED -->
      <section class="row-section">
        <div class="row-header">
          <h2>Top rated</h2>
          <span class="view-all">View all</span>
        </div>
        <div class="row-scroll" id="toprated-row"></div>
      </section>
    </main>
  </div>

  <script>
    const trending = [
      { title: "The Odyssey", year: 2026, gradient: "linear-gradient(160deg,#1e293b,#0f172a)" },
      { title: "Voyage of Meiwa", year: 2026, gradient: "linear-gradient(160deg,#0ea5e9,#0369a1)" },
      { title: "Hall Mary Protocol", year: 2026, gradient: "linear-gradient(160deg,#14b8a6,#065f46)" },
      { title: "The Furious Road", year: 2026, gradient: "linear-gradient(160deg,#dc2626,#7f1d1d)" },
      { title: "The Flock Detectives", year: 2026, gradient: "linear-gradient(160deg,#a3e635,#4d7c0f)" },
    ];
    const topRated = [
      { title: "Cellblock 9", year: 1998, gradient: "linear-gradient(160deg,#f59e0b,#92400e)" },
      { title: "The Family Ledger", year: 1972, gradient: "linear-gradient(160deg,#57534e,#1c1917)" },
      { title: "Ashfall Rising", year: 2019, gradient: "linear-gradient(160deg,#f97316,#7c2d12)" },
      { title: "Static Wire", year: 2010, gradient: "linear-gradient(160deg,#334155,#0f172a)" },
      { title: "Glacier Point", year: 2022, gradient: "linear-gradient(160deg,#7dd3fc,#1e40af)" },
    ];

    function renderRow(containerId, items, promo){
      const el = document.getElementById(containerId);
      let html = "";
      if(promo){
        html += `<div class="promo-card">
          <h3>Unlimited entertainment, for everyone</h3>
          <p>Stream thousands of movies and shows. Anytime, anywhere.</p>
        </div>`;
      }
      items.forEach(item => {
        html += `
          <div class="card">
            <div class="card-art" style="background:${item.gradient}">
              <div class="card-badge">${item.title.split(" ")[0]}</div>
            </div>
            <div class="card-info">
              <div class="t">${item.title}</div>
              <div class="y">${item.year}</div>
            </div>
          </div>`;
      });
      el.innerHTML = html;
    }

    renderRow("trending-row", trending, true);
    renderRow("toprated-row", topRated, false);
  </script>

</body>
</html>
